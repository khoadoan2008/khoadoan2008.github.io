<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#161f2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Subtle Radial Glow -->
  <circle cx="200" cy="180" r="140" fill="#10b981" opacity="0.08"/>
  <circle cx="200" cy="220" r="160" fill="#38bdf8" opacity="0.06"/>

  <!-- Code Grid lines in background -->
  <path d="M50 80 L350 80 M50 140 L350 140 M50 200 L350 200 M50 260 L350 260 M50 320 L350 320" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
  <path d="M80 50 L80 350 M140 50 L140 350 M200 50 L200 350 M260 50 L260 350 M320 50 L320 350" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>

  <!-- Avatar Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="155" r="58" fill="url(#avatarGrad)" stroke="url(#glow)" stroke-width="3"/>
  
  <!-- Shoulders & Torso -->
  <path d="M100 330 C100 245, 140 230, 200 230 C260 230, 300 245, 300 330 Z" fill="url(#avatarGrad)" stroke="url(#glow)" stroke-width="3"/>

  <!-- Developer Glasses / Tech Accent -->
  <rect x="165" y="142" width="28" height="18" rx="4" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <rect x="207" y="142" width="28" height="18" rx="4" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <line x1="193" y1="150" x2="207" y2="150" stroke="#38bdf8" stroke-width="3"/>

  <!-- Glowing Terminal Cursor / Tag below -->
  <rect x="130" y="348" width="140" height="28" rx="14" fill="#07090e" stroke="#334155" stroke-width="1.5"/>
  <text x="200" y="366" font-family="monospace" font-size="12" fill="#34d399" font-weight="bold" text-anchor="middle">
    &lt;KhoaDoan /&gt;
  </text>
</svg>
